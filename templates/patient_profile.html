{% extends "base.html" %}
{% block title %}Patient Profile{% endblock %}
{% block content %}
<h2>Update Your Profile</h2>
<form method="POST">
    <div class="mb-3">
        <label>Phone Number</label>
        <input type="tel" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
    </div>
    <div class="mb-3">
        <label>Age</label>
        <input type="number" name="age" class="form-control" value="{{ patient.age or '' }}">
    </div>
    <div class="mb-3">
        <label>Address</label>
        <textarea name="address" class="form-control" rows="3">{{ patient.address or '' }}</textarea>
    </div>
    <div class="mb-3">
        <label>Medical Conditions</label>
        <textarea name="medical_conditions" class="form-control" rows="3">{{ patient.medical_conditions or '' }}</textarea>
    </div>
    <div class="mb-3">
        <label>Emergency Contact</label>
        <input type="tel" name="emergency_contact" class="form-control" value="{{ patient.emergency_contact or '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Update Profile</button>
    <a href="{{ url_for('patient_dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
